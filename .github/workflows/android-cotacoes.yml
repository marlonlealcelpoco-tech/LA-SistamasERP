name: Android Cotações APK

on:
  push:
    branches: [main, feature/android-cotacoes]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Verify Java
        run: java -version

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.LA_COTACOES_API_URL }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LA-Cotacoes-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
