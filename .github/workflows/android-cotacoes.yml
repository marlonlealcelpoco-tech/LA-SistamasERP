name: Android Cotações APK

on:
  push:
    branches: [main, feature/android-cotacoes]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure production API
        run: printf '%s\n' 'VITE_API_URL=https://qutcnisrxwzgebgtogqk.supabase.co/functions/v1/la-cotacoes-api-v2' > .env.production

      - name: Build web app with Supabase API
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Gradle Java
        run: cd android && ./gradlew --version

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LA-Cotacoes-Supabase-v2-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
