name: ERP Tests

on:
  push:
    branches: ["main", "feature/financeiro-completo"]
  pull_request:
    branches: ["main"]

jobs:
  financial-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: la_erp
          POSTGRES_USER: la_erp
          POSTGRES_PASSWORD: la_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_erp -d la_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://la_erp:la_erp_dev@localhost:5432/la_erp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PostgreSQL schema and migrations
        env:
          PGPASSWORD: la_erp_dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h localhost -U la_erp -d la_erp -v ON_ERROR_STOP=1 -f database/schema.sql
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U la_erp -d la_erp -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: TypeScript/build check
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Run real PostgreSQL backend integration flow
        working-directory: backend
        run: node --import tsx --test src/integration/real-pdv-flow.test.ts

      - name: Verify official authorization matrix
        working-directory: backend
        run: node --import tsx --test src/auth/role-policy.test.ts src/auth/official-authorization-matrix.test.ts

      - name: Verify integration closing rules
        working-directory: backend
        run: |
          node -e "const fs=require('fs'); const p='src/finance/integration-close-tests.ts'; if(!fs.existsSync(p)) process.exit(1); const s=fs.readFileSync(p,'utf8'); for(const x of ['validateStockClosure','validateCashClosure','validateOperationalResult']) if(!s.includes(x)) process.exit(1); console.log('ERP closing rules: OK')"
