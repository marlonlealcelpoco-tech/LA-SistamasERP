name: ERP Tests

on:
  push:
    branches: ["main", "feature/financeiro-completo"]
  pull_request:
    branches: ["main"]

jobs:
  financial-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: TypeScript/build check
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Verify official authorization matrix
        working-directory: backend
        run: node --import tsx --test src/auth/role-policy.test.ts

      - name: Verify integration closing rules
        working-directory: backend
        run: |
          node -e "const fs=require('fs'); const p='src/finance/integration-close-tests.ts'; if(!fs.existsSync(p)) process.exit(1); const s=fs.readFileSync(p,'utf8'); for(const x of ['validateStockClosure','validateCashClosure','validateOperationalResult']) if(!s.includes(x)) process.exit(1); console.log('ERP closing rules: OK')"
