services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: la_erp
      POSTGRES_USER: la_erp
      POSTGRES_PASSWORD: la_erp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/001_enable_user_identity.sql:/docker-entrypoint-initdb.d/002-enable-user-identity.sql:ro

volumes:
  postgres_data:
